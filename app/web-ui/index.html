<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Figure Lab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo">◆</span>
            <span class="app-name">Open Figure Lab</span>
        </div>
        <div class="topbar-center">
            <span id="projectName" class="project-name">soc_proxy_fig2</span>
        </div>
        <div class="topbar-right">
            <span class="version">v0.1.0</span>
        </div>
    </header>

    <div class="workbench">
        <!-- Left Panel: Command -->
        <aside class="panel panel-command">
            <div class="panel-header">
                <span class="panel-icon">▸</span>
                <span class="panel-title">Command</span>
            </div>
            <div class="panel-body">
                <div class="command-section">
                    <div class="section-label">Actions</div>
                    <div class="command-buttons">
                        <button id="btnValidate" class="btn btn-action">
                            <span class="btn-icon">✓</span>
                            <span>Validate</span>
                        </button>
                        <button id="btnRender" class="btn btn-action">
                            <span class="btn-icon">◉</span>
                            <span>Render</span>
                        </button>
                        <button id="btnQA" class="btn btn-action">
                            <span class="btn-icon">◈</span>
                            <span>QA</span>
                        </button>
                    </div>
                </div>
                <div class="command-section">
                    <div class="section-label">Status</div>
                    <div class="command-status">
                        <span id="statusIndicator" class="status-dot"></span>
                        <span id="statusText">Ready</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Panel: Figure Preview -->
        <main class="panel panel-preview">
            <div class="panel-header">
                <span class="panel-icon">□</span>
                <span class="panel-title">Figure Preview</span>
                <button id="btnRefresh" class="btn btn-icon-only" title="Refresh">↻</button>
            </div>
            <div class="panel-body">
                <div id="previewContainer" class="preview-container">
                    <div id="previewEmpty" class="empty-state">
                        <div class="empty-icon">◇</div>
                        <div class="empty-text">No figure rendered</div>
                        <div class="empty-hint">Click <strong>Render</strong> to generate</div>
                    </div>
                    <img id="previewImage" class="preview-image" style="display: none;" alt="Figure preview">
                </div>
            </div>
            <div class="panel-footer">
                <span id="previewInfo" class="preview-info">—</span>
            </div>
        </main>

        <!-- Right Panel: Inspector -->
        <aside class="panel panel-inspector">
            <div class="panel-header">
                <span class="panel-icon">◉</span>
                <span class="panel-title">Inspector</span>
            </div>
            <div class="panel-tabs">
                <button class="tab active" data-tab="spec">Spec</button>
                <button class="tab" data-tab="data">Data</button>
                <button class="tab" data-tab="qa">QA</button>
            </div>
            <div class="panel-body">
                <pre id="specContent" class="code-block"></pre>
                <pre id="dataContent" class="code-block" style="display: none;"></pre>
                <div id="qaContent" class="qa-content" style="display: none;"></div>
            </div>
        </aside>
    </div>

    <!-- Bottom Panel: Run Log -->
    <footer class="panel panel-log">
        <div class="panel-header">
            <span class="panel-icon">▷</span>
            <span class="panel-title">Run Log</span>
            <button id="btnClearLog" class="btn btn-icon-only" title="Clear log">✕</button>
        </div>
        <div class="panel-body">
            <div id="runLog" class="run-log"></div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
